name: flyrank-capstone-metering-billing
version: 1.0.0
track: backend
language: python
framework: fastapi
database: postgresql
payment_provider: razorpay-test

run: "docker compose up --build"
seed: "docker compose exec backend python scripts/seed_data.py"
test: "docker compose exec backend pytest -v tests/"
base_url: "http://localhost:8000"

endpoints:
  health: "GET /health"
  tenants: "POST /api/v1/tenants"
  tenant_me: "GET /api/v1/tenants/me"
  generate: "POST /api/v1/generate"
  usage: "GET /api/v1/usage"
  usage_events: "GET /api/v1/usage/events"
  subscription: "POST /api/v1/billing/subscription"
  webhooks: "POST /api/v1/webhooks/razorpay"

probes:
  probe_1: "pytest tests/integration/test_acceptance_probes_metering.py::test_probe_1_idempotent_metering_sequential_and_concurrent -v"
  probe_2: "pytest tests/integration/test_acceptance_probes_metering.py::test_probe_2_quota_boundary_honesty -v"
  probe_3: "pytest tests/integration/test_acceptance_probes_webhooks.py::test_probe_3_pro_upgrade -v"
  probe_4: "pytest tests/integration/test_acceptance_probes_webhooks.py::test_probe_4_webhook_security -v"
  probe_5: "pytest tests/integration/test_acceptance_probes_metering.py::test_probe_5_ai_token_pricing_verification -v"

