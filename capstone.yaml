name: flyrank-capstone-metering-billing
version: 1.0.0
track: backend
language: python
framework: fastapi
database: postgresql
payment_provider: razorpay-test

run: "docker compose up --build"
seed: "docker compose exec backend python scripts/seed_data.py"
test: "docker compose exec backend pytest -v tests/"
base_url: "http://localhost:8000"

endpoints:
  health: "GET /health"
  tenants_create: "POST /api/v1/tenants"
  tenant_me: "GET /api/v1/tenants/me"
  generate: "POST /api/v1/generate"
  usage: "GET /api/v1/usage"
  usage_events: "GET /api/v1/usage/events"
  subscription_create: "POST /api/v1/billing/subscription"
  subscription_get: "GET /api/v1/billing/subscription"
  webhook: "POST /api/v1/webhooks/razorpay"
